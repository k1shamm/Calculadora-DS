<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Calculadora DS </title>
    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="contenedor">
        <header class="encabezado">
            <div>
                <h1>Calculadora<span> DS.</span></h1>
                <p>Una herramienta simple, clara y lista para calcular.</p>
            </div>
        </header>

        <section class="calculadora">
            <div class="pantalla">
                <span>RESULTADO</span>
                <output id="resultado">0</output>
            </div>

            <div class="campos">
                <label for="num1">Primer número</label>
                <input type="number" id="num1" placeholder="Ingrese un número">

                <label for="num2">Segundo número</label>
                <input type="number" id="num2" placeholder="Ingrese otro número">
            </div>

            <div class="botones">
                <button class="operacion" onclick="sumar()">＋ Sumar</button>
                <button class="operacion" onclick="restar()">− Restar</button>
                <button class="deshabilitado" disabled title="Disponible en una versión futura">× Multiplicar</button>
                <button class="deshabilitado" disabled title="Disponible en una versión futura">÷ Dividir</button>
            </div>
            <p class="nota">Las operaciones de multiplicación y división estarán disponibles en una próxima versión.</p>
        </section>

        <footer> DATA SEEKERS </footer>
    </main>
</body>
</html>
